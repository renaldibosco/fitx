name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error::$(sed -n '/What went wrong/,/Try:/p' build.log | tr '\n' ' ' | cut -c1-3000)"
            echo "::error::$(grep -iE 'error:|e: |exception' build.log | head -8 | tr '\n' ' ' | cut -c1-3000)"
            tail -60 build.log
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../FitX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FitX-apk
          path: FitX.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FitX v1.0.${{ github.run_number }}
          body: |
            Download **FitX.apk** below and open it on your phone to install.
            Updates install over the previous version — your workouts are kept.
          files: FitX.apk
          make_latest: true
